<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Miniflix</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #141414;
      --card-bg: #1f1f1f;
      --accent: #e50914;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #2e2e2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
    }

    /* Cabeçalho e Busca */
    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-align: center;
    }

    .search-box input {
      width: 100%;
      background: #222;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Abas de Categoria */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      background: #242424;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Grade de Mídias */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.97);
    }

    .poster-container {
      position: relative;
      width: 100%;
      padding-top: 145%;
      background: #222;
    }

    .poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
    }

    .card-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: #1a1a1a;
      width: 100%;
      max-height: 85vh;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      overflow-y: auto;
      border-top: 1px solid #333;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
    }

    .modal-poster {
      width: 90px;
      height: 130px;
      border-radius: 6px;
      object-fit: cover;
    }

    .modal-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .modal-synopsis {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* Seletores de Séries */
    .season-selector {
      margin-bottom: 14px;
    }

    .season-selector select {
      width: 100%;
      background: #282828;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      font-size: 0.85rem;
      outline: none;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .ep-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #fff;
      padding: 10px 4px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .ep-btn:active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .play-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:active {
      opacity: 0.85;
    }

    .close-btn {
      background: #333;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 8px;
      cursor: pointer;
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40px;
      font-size: 0.9rem;
      grid-column: 1/-1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">MINIFLIX</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar filmes, séries, animes..." oninput="executarBusca()" />
    </div>
    <div class="tabs">
      <button class="tab active" onclick="filtrarCategoria('todos')">Todos</button>
      <button class="tab" onclick="filtrarCategoria('filme')">Filmes</button>
      <button class="tab" onclick="filtrarCategoria('serie')">Séries</button>
      <button class="tab" onclick="filtrarCategoria('anime')">Animes</button>
      <button class="tab" onclick="filtrarCategoria('cartoon')">Cartoons</button>
    </div>
  </header>

  <div class="grid" id="catalogoGrid">
    <div class="status-msg">Carregando catálogo do Miniflix...</div>
  </div>

  <!-- Modal de Detalhes -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModalExterno(event)">
    <div class="modal-content">
      <div class="modal-header">
        <img src="" id="modalImg" class="modal-poster" alt="" />
        <div class="modal-info">
          <span class="badge" id="modalBadge"></span>
          <div class="modal-title" id="modalTitulo"></div>
          <div class="card-meta" id="modalMeta"></div>
        </div>
      </div>

      <p class="modal-synopsis" id="modalSinopse"></p>

      <!-- Painel: Filme -->
      <div id="painelFilme" style="display: none;">
        <button class="play-btn" onclick="solicitarMidiaFilme()">▶ Assistir Filme</button>
      </div>

      <!-- Painel: Séries / Animes -->
      <div id="painelSerie" style="display: none;">
        <div class="season-selector">
          <select id="selectTemporada" onchange="mudarTemporada()"></select>
        </div>
        <div class="episodes-grid" id="gridEpisodios"></div>
      </div>

      <button class="close-btn" onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BOT_USERNAME = "miniflix_drive_bot";

    // URL LOCAL: Aponta para o bot.py rodando no seu computador
    // (Quando for para o Render, basta trocar por: "https://seu-app.onrender.com")
    const API_BASE_URL = "https://miniflix-app.onrender.com"; // sem barra no final

    let acervo = [];
    let categoriaAtual = 'todos';
    let itemSelecionado = null;

    // Busca o catálogo real gerado pelo bot.py no Supabase
    async function carregarCatalogo() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/catalogo`);
        if (res.ok) {
          acervo = await res.json();
          renderizarGrade(acervo);
          return;
        }
      } catch (err) {
        console.warn("Servidor local desligado ou inacessível:", err);
      }

      // Exibição amigável caso o bot local não esteja aberto
      document.getElementById('catalogoGrid').innerHTML = `
        <div class="status-msg">
          <p style="color: #fff; font-weight: bold; margin-bottom: 6px;">Servidor Local Offline</p>
          <p style="font-size: 0.8rem; color: #888;">Inicie o seu <code>bot.py</code> no terminal e recarregue esta página (F5) para ver os títulos e capas reais do TMDB.</p>
        </div>
      `;
    }

    function renderizarGrade(lista) {
      const grid = document.getElementById('catalogoGrid');
      grid.innerHTML = '';

      if (!lista || lista.length === 0) {
        grid.innerHTML = '<p class="status-msg">Nenhum título encontrado no banco de dados.</p>';
        return;
      }

      lista.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => abrirModal(item);
        card.innerHTML = `
          <div class="poster-container">
            <span class="badge">${item.tipo || 'midia'}</span>
            <img src="${item.img || 'https://via.placeholder.com/300x450'}" class="poster" alt="${item.titulo}" loading="lazy" />
          </div>
          <div class="card-info">
            <div class="card-title">${item.titulo}</div>
            <div class="card-meta">${item.ano || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrarCategoria(cat) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      categoriaAtual = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('searchInput').value = '';
      
      const filtrados = cat === 'todos' ? acervo : acervo.filter(i => i.tipo === cat);
      renderizarGrade(filtrados);
    }

    function executarBusca() {
      const termo = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtrados = acervo;

      if (categoriaAtual !== 'todos') {
        filtrados = filtrados.filter(i => i.tipo === categoriaAtual);
      }

      if (termo) {
        filtrados = filtrados.filter(i => (i.titulo || '').toLowerCase().includes(termo));
      }

      renderizarGrade(filtrados);
    }

    function abrirModal(item) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      itemSelecionado = item;

      document.getElementById('modalImg').src = item.img || 'https://via.placeholder.com/300x450';
      document.getElementById('modalBadge').innerText = item.tipo;
      document.getElementById('modalTitulo').innerText = item.titulo;
      document.getElementById('modalMeta').innerText = `${item.ano || ''} • ${(item.tipo || '').toUpperCase()}`;
      document.getElementById('modalSinopse').innerText = item.sinopse || 'Sem sinopse cadastrada.';

      const painelFilme = document.getElementById('painelFilme');
      const painelSerie = document.getElementById('painelSerie');

      if (item.tipo === 'filme') {
        painelFilme.style.display = 'block';
        painelSerie.style.display = 'none';
      } else {
        painelFilme.style.display = 'none';
        painelSerie.style.display = 'block';

        const selectTemp = document.getElementById('selectTemporada');
        selectTemp.innerHTML = '';
        const temps = Object.keys(item.temporadas || {});
        
        if (temps.length > 0) {
          temps.forEach(temp => {
            const opt = document.createElement('option');
            opt.value = temp;
            opt.innerText = `Temporada ${temp}`;
            selectTemp.appendChild(opt);
          });
          mudarTemporada();
        } else {
          document.getElementById('gridEpisodios').innerHTML = '<p style="color: #777; font-size: 0.8rem;">Nenhum episódio cadastrado para este título.</p>';
        }
      }

      document.getElementById('modalOverlay').classList.add('open');
      if (tg?.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(fecharModal);
      }
    }

    function mudarTemporada() {
      const selectTemp = document.getElementById('selectTemporada');
      const tempEscolhida = selectTemp.value;
      const episodios = (itemSelecionado.temporadas && itemSelecionado.temporadas[tempEscolhida]) || [];
      const grid = document.getElementById('gridEpisodios');
      grid.innerHTML = '';

      episodios.forEach(ep => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = `EP ${ep < 10 ? '0' + ep : ep}`;
        btn.onclick = () => solicitarMidiaEpisodio(tempEscolhida, ep);
        grid.appendChild(btn);
      });
    }

    function fecharModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      if (tg?.BackButton) tg.BackButton.hide();
    }

    function fecharModalExterno(e) {
      if (e.target.id === 'modalOverlay') fecharModal();
    }

    function solicitarMidiaFilme() {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      try {
        tg.sendData(JSON.stringify({ acao: 'play', tipo: 'filme', id: itemSelecionado.id }));
        tg.close();
      } catch (e) {
        if (tg?.openTelegramLink) {
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=play_${itemSelecionado.id}`);
        } else {
          window.open(`https://t.me/${BOT_USERNAME}?start=play_${itemSelecionado.id}`, '_blank');
        }
      }
    }

    function solicitarMidiaEpisodio(temporada, episodio) {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      try {
        tg.sendData(JSON.stringify({
          acao: 'play',
          tipo: itemSelecionado.tipo,
          id: itemSelecionado.id,
          temporada: parseInt(temporada),
          episodio: parseInt(episodio)
        }));
        tg.close();
      } catch (e) {
        if (tg?.openTelegramLink) {
          tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=play_${itemSelecionado.id}_${temporada}_${episodio}`);
        } else {
          window.open(`https://t.me/${BOT_USERNAME}?start=play_${itemSelecionado.id}_${temporada}_${episodio}`, '_blank');
        }
      }
    }

    // Inicialização
    carregarCatalogo();
  </script>
</body>
</html>
